# Production stack: authorization server + application.
# PostgreSQL is NOT included: both services connect to your existing server (AUTH_DB_URL / APP_DB_URL).
#   - Postgres on the Docker host        -> jdbc:postgresql://host.docker.internal:5432/... (extra_hosts below)
#   - Postgres in another container      -> also use docker-compose.dbnet.yml to join its network
# Inside each container the connection uses DB_URL / DB_USERNAME / DB_PASSWORD (same names as featuretoggle).
# Deploying with Coolify? Use docker-compose.coolify.yml instead (no host ports, Coolify's proxy routes the domains).
name: home-inspect

services:
  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: home-inspect/auth-server:latest
    restart: unless-stopped
    environment:
      DB_URL: ${AUTH_DB_URL:-jdbc:postgresql://host.docker.internal:5432/homeinspect_auth}
      DB_USERNAME: ${AUTH_DB_USERNAME:-homeinspect_auth}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:?set AUTH_ISSUER_URI in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      AUTH_KEYS_DIR: /data/keys
      AUTH_KEYSTORE_PASSWORD: ${AUTH_KEYSTORE_PASSWORD:?set AUTH_KEYSTORE_PASSWORD in .env}
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:?set WEB_CLIENT_SECRET in .env}
      WEB_REDIRECT_URI: ${PUBLIC_URL:?set PUBLIC_URL in .env}/login/oauth2/code/home-inspect
      WEB_POST_LOGOUT_REDIRECT_URI: ${PUBLIC_URL}/
      ADMIN_API_CLIENT_SECRET: ${ADMIN_API_CLIENT_SECRET:?set ADMIN_API_CLIENT_SECRET in .env}
      AUTH_MFA_ENABLED: ${AUTH_MFA_ENABLED:-false}
      AUTH_MFA_REQUIRED: ${AUTH_MFA_REQUIRED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${AUTH_PORT:-9000}:9000"
    volumes:
      - auth-keys:/data/keys
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: home-inspect/app:latest
    restart: unless-stopped
    depends_on:
      auth-server:
        condition: service_healthy
    environment:
      DB_URL: ${APP_DB_URL:-jdbc:postgresql://host.docker.internal:5432/homeinspect_app}
      DB_USERNAME: ${APP_DB_USERNAME:-homeinspect_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET}
      ADMIN_API_CLIENT_SECRET: ${ADMIN_API_CLIENT_SECRET}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-15MB}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  uploads:
  auth-keys:
