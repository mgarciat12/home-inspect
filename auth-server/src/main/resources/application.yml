spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${AUTH_DB_NAME:homeinspect_auth}
    username: ${AUTH_DB_USER:homeinspect_auth}
    password: ${AUTH_DB_PASSWORD:homeinspect_auth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: auth
  flyway:
    schemas: auth
    default-schema: auth
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  messages:
    basename: messages
    fallback-to-system-locale: false
  web:
    locale: es
    locale-resolver: fixed

server:
  port: ${PORT:9000}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
