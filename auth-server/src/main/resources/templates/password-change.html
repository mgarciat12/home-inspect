<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{password.title})}"></head>
<body class="auth-bg">
<div class="position-absolute top-0 end-0 p-3"><div th:replace="~{fragments/layout :: themeSelector}"></div></div>
<main class="container d-flex flex-column align-items-center justify-content-center flex-grow-1 py-5">
    <div th:replace="~{fragments/layout :: brand}"></div>
    <div class="card auth-card border-0 shadow-sm">
        <div class="card-body p-4">
            <h2 class="h5 mb-3" th:text="#{password.heading}">Cambiar contraseña</h2>
            <div class="alert alert-info d-flex gap-2" role="alert" th:if="${required}">
                <i class="bi bi-info-circle-fill"></i><span th:text="#{password.required}">Debes cambiar la contraseña temporal.</span>
            </div>
            <form th:action="@{/password/change}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label for="currentPassword" class="form-label" th:text="#{password.current}">Contraseña actual</label>
                    <input type="password" th:field="*{currentPassword}" class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                           autocomplete="current-password" required>
                    <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label" th:text="#{password.new}">Nueva contraseña</label>
                    <input type="password" th:field="*{newPassword}" class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                           autocomplete="new-password" required>
                    <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                    <div class="form-text" th:text="#{password.hint(${minLength})}">Mínimo 10 caracteres.</div>
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label" th:text="#{password.confirm}">Repite la nueva contraseña</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control form-control-lg"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           autocomplete="new-password" required>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100" th:text="#{password.submit}">Guardar</button>
            </form>
            <form th:action="@{/logout}" method="post" class="mt-3 text-center">
                <button type="submit" class="btn btn-link btn-sm text-body-secondary" th:text="#{action.logout}">Cerrar sesión</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
