spring:
  application:
    name: home-inspect
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homeinspect_app}
    username: ${DB_USERNAME:homeinspect_app}
    password: ${DB_PASSWORD:homeinspect_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  messages:
    basename: messages
    fallback-to-system-locale: false
  security:
    oauth2:
      client:
        provider:
          home-inspect:
            # Discovery at startup: the container must reach the auth-server at this exact URL
            issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
            user-name-attribute: sub
        registration:
          home-inspect:
            provider: home-inspect
            client-name: home-inspect
            client-id: home-inspect-web
            client-secret: ${WEB_CLIENT_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile
          home-inspect-admin-api:
            provider: home-inspect
            client-id: home-inspect-admin-api
            client-secret: ${ADMIN_API_CLIENT_SECRET:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: users.admin
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:15MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:200MB}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        # Distinct names: on localhost both services would otherwise overwrite each other's cookie
        name: HI_APP_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

home-inspect:
  auth-server:
    # Base URL of the auth-server API (/api/users); same as the issuer by default
    url: ${AUTH_SERVER_URL:${AUTH_ISSUER_URI:http://localhost:9000}}
  storage:
    # Photos, signatures and logo are stored here (Docker volume in production)
    root: ${UPLOAD_DIR:./data/uploads}
  photos:
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:15MB}
    # Longest side of the version used in the app and the PDF, and of the thumbnail
    optimized-size: 1600
    thumbnail-size: 400
    jpeg-quality: 0.85
    # Command used to convert HEIC to PNG (installed in the Docker image); empty = HEIC rejected
    heic-command: ${HEIC_COMMAND:heif-thumbnailer}
  pdf:
    # TTF fonts embedded in the PDF (DejaVu, installed in the Docker image); Helvetica if missing
    font-dir: ${PDF_FONT_DIR:/usr/share/fonts/dejavu}
