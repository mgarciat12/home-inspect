<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head(#{profile.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4" style="max-width: 44rem">
    <h1 class="h3 mb-3" th:text="#{profile.title}">Mi perfil</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-4">
            <h2 class="h6 text-uppercase text-body-secondary mb-3" th:text="#{profile.account}">Cuenta</h2>
            <dl class="detail-list mb-3">
                <dt th:text="#{profile.name}">Nombre</dt><dd th:text="${profile.displayName}">Nombre</dd>
                <dt th:text="#{profile.username}">Usuario</dt><dd class="font-monospace" th:text="${profile.username}">usuario</dd>
                <dt th:text="#{profile.email}">Correo</dt><dd th:text="${profile.email} ?: '—'">correo</dd>
                <dt th:text="#{profile.role}">Rol</dt><dd th:text="#{'role.' + ${profile.role}}">Inspector</dd>
            </dl>
            <p class="small text-body-secondary" th:text="#{profile.accountHint}">Gestionado en el servidor de acceso.</p>
            <a class="btn btn-outline-primary" th:href="${passwordUrl}"><i class="bi bi-key me-1"></i><span th:text="#{profile.changePassword}">Cambiar contraseña</span></a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h2 class="h6 text-uppercase text-body-secondary mb-3" th:text="#{profile.signature}">Firma</h2>
            <p class="small text-body-secondary" th:text="#{profile.signature.hint}">Imagen de la firma.</p>
            <div class="mb-3">
                <img class="signature-preview" th:if="${profile.hasSignature}" th:src="@{/profile/signature(v=${#dates.createNow().time})}" th:alt="#{profile.signature}">
                <p class="text-body-secondary fst-italic" th:unless="${profile.hasSignature}" th:text="#{profile.signature.none}">Sin firma.</p>
            </div>
            <form th:action="@{/profile/signature}" method="post" enctype="multipart/form-data" class="d-flex flex-wrap gap-2">
                <input type="file" name="file" class="form-control" accept="image/png,image/jpeg" required style="max-width: 22rem">
                <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-1"></i><span th:text="#{profile.signature.upload}">Subir firma</span></button>
            </form>
            <form th:action="@{/profile/signature/delete}" method="post" class="mt-2" th:if="${profile.hasSignature}">
                <button type="submit" class="btn btn-link text-danger px-0"><i class="bi bi-trash me-1"></i><span th:text="#{profile.signature.delete}">Quitar firma</span></button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
