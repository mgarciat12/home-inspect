<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Photos of an element: grid with caption, order, cover and delete; camera / gallery / drag & drop upload -->
<div th:fragment="itemPhotos(reportId, item, editable)" class="item-photos mt-3 pt-3 border-top"
     th:attr="data-upload-url=@{/reports/{r}/items/{i}/photos(r=${reportId},i=${item.id})},
              data-order-url=@{/reports/{r}/items/{i}/photos/order(r=${reportId},i=${item.id})},
              data-photo-base=@{/reports/{r}/photos/(r=${reportId})},
              data-editable=${editable}">
    <div class="d-flex align-items-center gap-2 mb-2">
        <span class="fw-semibold"><i class="bi bi-images me-1"></i><span th:text="#{item.photos}">Fotos</span></span>
        <span class="badge text-bg-light border photo-count" th:text="${#lists.size(item.photos)}">0</span>
    </div>

    <div class="photo-grid">
        <figure class="photo-card" th:each="p : ${item.photos}" th:attr="data-photo-id=${p.id}">
            <a th:href="@{${p.url}}" target="_blank" rel="noopener" class="photo-thumb">
                <img th:src="@{${p.thumbnailUrl}}" th:alt="${p.caption} ?: #{item.photos}" loading="lazy">
                <span class="badge text-bg-warning photo-cover-badge" th:classappend="${p.cover} ? '' : 'd-none'">
                    <i class="bi bi-star-fill me-1"></i><span th:text="#{photo.cover}">Portada</span></span>
            </a>
            <figcaption>
                <input type="text" class="form-control form-control-sm" maxlength="500" data-caption
                       th:value="${p.caption}" th:placeholder="#{photo.caption}" th:aria-label="#{photo.caption}" th:disabled="${!editable}">
                <div class="btn-group btn-group-sm w-100 mt-1" role="group" th:if="${editable}">
                    <button type="button" class="btn btn-outline-secondary" data-photo-action="left" th:title="#{photo.moveLeft}"><i class="bi bi-arrow-left"></i></button>
                    <button type="button" class="btn btn-outline-secondary" data-photo-action="right" th:title="#{photo.moveRight}"><i class="bi bi-arrow-right"></i></button>
                    <button type="button" class="btn btn-outline-warning" data-photo-action="cover" th:title="#{photo.makeCover}"><i class="bi bi-star"></i></button>
                    <button type="button" class="btn btn-outline-danger" data-photo-action="delete" th:title="#{photo.delete}"><i class="bi bi-trash"></i></button>
                </div>
            </figcaption>
        </figure>
    </div>

    <div class="photo-dropzone mt-2" th:if="${editable}">
        <div class="d-flex flex-wrap align-items-center gap-2">
            <label class="btn btn-primary mb-0">
                <i class="bi bi-camera me-1"></i><span th:text="#{photo.takePhoto}">Hacer foto</span>
                <input type="file" accept="image/*" capture="environment" multiple hidden data-photo-input>
            </label>
            <label class="btn btn-outline-primary mb-0">
                <i class="bi bi-images me-1"></i><span th:text="#{photo.chooseFiles}">Galería</span>
                <input type="file" accept="image/jpeg,image/png,image/heic,image/heif,.heic,.heif" multiple hidden data-photo-input>
            </label>
            <span class="small text-body-secondary d-none d-md-inline" th:text="#{photo.dropHint}">o arrastra aquí las fotos</span>
        </div>
        <div class="upload-status small mt-2" aria-live="polite"></div>
    </div>
</div>
</body>
</html>
