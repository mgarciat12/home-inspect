<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · home-inspect'">home-inspect</title>
    <script>
        // Apply the saved (or system) color mode before the page paints
        (function () {
            var mode = null;
            try { mode = localStorage.getItem('hi-theme'); } catch (e) { }
            if (!mode || mode === 'auto') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', mode);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg app-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-house-check"></i></span>home-inspect
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" th:aria-label="#{nav.toggle}">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/reports}"><i class="bi bi-clipboard2-check me-1"></i><span th:text="#{nav.reports}">Informes</span></a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-gear me-1"></i><span th:text="#{nav.admin}">Administración</span>
                    </a>
                    <ul class="dropdown-menu shadow-sm">
                        <li><a class="dropdown-item" th:href="@{/admin/users}"><i class="bi bi-people me-2"></i><span th:text="#{nav.admin.users}">Usuarios</span></a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/settings}"><i class="bi bi-building me-2"></i><span th:text="#{nav.admin.settings}">Empresa y textos</span></a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/comments}"><i class="bi bi-chat-square-quote me-2"></i><span th:text="#{nav.admin.comments}">Biblioteca de comentarios</span></a></li>
                    </ul>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2 ms-auto py-2 py-lg-0">
                <div th:replace="~{fragments/layout :: themeSelector}"></div>
                <div class="dropdown" sec:authorize="isAuthenticated()">
                    <button class="btn btn-sm user-chip dropdown-toggle d-flex align-items-center gap-2" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="avatar" th:text="${#strings.substring(#authentication.principal.fullName ?: #authentication.name, 0, 1)}">A</span>
                        <span class="text-truncate" style="max-width: 10rem" th:text="${#authentication.principal.fullName ?: #authentication.name}">usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><span class="dropdown-item-text small text-body-secondary" th:text="${#authentication.name}">usuario</span></li>
                        <li><span class="dropdown-item-text">
                            <span class="badge text-bg-primary" sec:authorize="hasRole('ADMIN')" th:text="#{role.ADMIN}">Administrador</span>
                            <span class="badge text-bg-secondary" sec:authorize="hasRole('INSPECTOR')" th:text="#{role.INSPECTOR}">Inspector</span>
                        </span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person-badge me-2"></i><span th:text="#{nav.profile}">Mi perfil</span></a></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i><span th:text="#{action.logout}">Cerrar sesión</span></button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="themeSelector" class="dropdown">
    <button class="btn btn-sm btn-icon dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"
            th:title="#{theme.title}">
        <i class="bi bi-circle-half"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><button type="button" class="dropdown-item" data-theme-value="light"><i class="bi bi-sun me-2"></i><span th:text="#{theme.light}">Claro</span></button></li>
        <li><button type="button" class="dropdown-item" data-theme-value="dark"><i class="bi bi-moon-stars me-2"></i><span th:text="#{theme.dark}">Oscuro</span></button></li>
        <li><button type="button" class="dropdown-item" data-theme-value="auto"><i class="bi bi-circle-half me-2"></i><span th:text="#{theme.auto}">Automático</span></button></li>
    </ul>
</div>

<div th:fragment="flash" class="flash-messages">
    <div class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2" role="alert" th:if="${message}">
        <i class="bi bi-check-circle-fill"></i><span th:text="${message}">Hecho</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:aria-label="#{action.close}"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2" role="alert" th:if="${error}">
        <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:aria-label="#{action.close}"></button>
    </div>
</div>

<footer th:fragment="footer" class="app-footer py-4 mt-auto">
    <div class="container d-flex flex-wrap justify-content-between gap-2 small text-body-secondary">
        <span><i class="bi bi-house-check me-1"></i>home-inspect</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
