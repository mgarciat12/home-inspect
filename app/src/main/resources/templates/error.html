<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head(#{error.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-5 text-center" style="max-width: 36rem">
    <i class="bi fs-1 text-body-secondary"
       th:classappend="${status == 404} ? 'bi-signpost-split' : (${status == 403} ? 'bi-shield-lock' : 'bi-exclamation-octagon')"></i>
    <h1 class="h3 my-3" th:text="${status == 404} ? #{error.404} : (${status == 403} ? #{error.403} : #{error.generic})">Error</h1>
    <p class="text-body-secondary" th:text="#{error.hint}">Vuelve al inicio.</p>
    <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house me-1"></i><span th:text="#{error.home}">Ir al inicio</span></a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
