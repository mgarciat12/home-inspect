<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head(#{settings.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4" style="max-width: 48rem">
    <h1 class="h3 mb-1" th:text="#{settings.title}">Empresa y textos</h1>
    <p class="text-body-secondary" th:text="#{settings.lead}">Aparecen en la portada y el pie del PDF.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Logo -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-4">
            <h2 class="h6 text-uppercase text-body-secondary mb-3" th:text="#{settings.logo}">Logo</h2>
            <img class="signature-preview mb-3" th:if="${hasLogo}" th:src="@{/settings/logo(v=${#dates.createNow().time})}" th:alt="#{settings.logo}">
            <p class="text-body-secondary fst-italic" th:unless="${hasLogo}" th:text="#{settings.logo.none}">Sin logo.</p>
            <form th:action="@{/admin/settings/logo}" method="post" enctype="multipart/form-data" class="d-flex flex-wrap gap-2">
                <input type="file" name="file" class="form-control" accept="image/png,image/jpeg" required style="max-width: 22rem">
                <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-1"></i><span th:text="#{settings.logo.upload}">Subir logo</span></button>
            </form>
            <form th:action="@{/admin/settings/logo/delete}" method="post" class="mt-2" th:if="${hasLogo}">
                <button type="submit" class="btn btn-link text-danger px-0"><i class="bi bi-trash me-1"></i><span th:text="#{settings.logo.delete}">Quitar logo</span></button>
            </form>
        </div>
    </div>

    <form th:action="@{/admin/settings}" th:object="${form}" method="post" novalidate>
        <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}" th:text="#{form.hasErrors}">Revisa los campos.</div>
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body p-4">
                <h2 class="h6 text-uppercase text-body-secondary mb-3" th:text="#{settings.company}">Empresa</h2>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="companyName" th:text="#{settings.companyName}">Nombre</label>
                        <input type="text" class="form-control" th:field="*{companyName}" th:classappend="${#fields.hasErrors('companyName')} ? 'is-invalid'">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="address" th:text="#{settings.address}">Dirección</label>
                        <input type="text" class="form-control" th:field="*{address}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="phone" th:text="#{settings.phone}">Teléfono</label>
                        <input type="tel" class="form-control" th:field="*{phone}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="email" th:text="#{settings.email}">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="website" th:text="#{settings.website}">Web</label>
                        <input type="text" class="form-control" th:field="*{website}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="taxId" th:text="#{settings.taxId}">NIF/CIF</label>
                        <input type="text" class="form-control" th:field="*{taxId}">
                    </div>
                </div>
            </div>
        </div>
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body p-4">
                <h2 class="h6 text-uppercase text-body-secondary mb-3" th:text="#{settings.texts}">Textos del informe</h2>
                <div class="mb-3">
                    <label class="form-label" for="scopeText" th:text="#{settings.scopeText}">Alcance</label>
                    <textarea class="form-control" rows="8" th:field="*{scopeText}"></textarea>
                    <div class="form-text" th:text="#{settings.scopeText.hint}">Página de alcance del PDF.</div>
                </div>
                <div>
                    <label class="form-label" for="legalText" th:text="#{settings.legalText}">Texto legal</label>
                    <textarea class="form-control" rows="4" th:field="*{legalText}"></textarea>
                    <div class="form-text" th:text="#{settings.legalText.hint}">Al final del PDF.</div>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check2 me-1"></i><span th:text="#{action.save}">Guardar</span></button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
