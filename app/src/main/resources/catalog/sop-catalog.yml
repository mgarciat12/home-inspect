# Report structure, following the areas of the home inspection Standard of Practice.
#
# Loaded at every start (CatalogSeeder) and synchronised with the database by "code":
#  - new sections / items are created (with their comments for the comment library),
#  - titles, order, materials and limitations are updated,
#  - elements removed from this file are deactivated (existing reports keep them).
# The comment library is only seeded when an item is created: afterwards it is edited
# from the admin panel. Codes must not change once used.

# Limitations offered on every item
limitations:
  - Objetos almacenados
  - Mobiliario
  - Sin acceso
  - Nieve o hielo
  - Vegetación
  - Altura o pendiente
  - Equipo apagado
  - Servicios desconectados (agua, luz o gas)
  - Acabados que ocultan el elemento
  - Condiciones meteorológicas

sections:
  - code: roof
    title: Tejado
    description: Cubierta, canalones y bajantes, tapajuntas, chimeneas, claraboyas y penetraciones.
    methods: [Caminando sobre la cubierta, Desde el borde con escalera, Desde el suelo, Con dron]
    items:
      - code: covering
        title: Cubierta
        materials: [Teja cerámica, Teja de hormigón, Pizarra, Tela asfáltica, Chapa metálica, Panel sándwich, Fibrocemento, Membrana impermeable (cubierta plana), Cubierta plana transitable]
        comments:
          - Se observan tejas rotas, desplazadas o sueltas. Se recomienda su reposición por un profesional de cubiertas.
          - Presencia de musgo y suciedad acumulada en la cubierta; se recomienda limpieza periódica.
          - La cubierta presenta un desgaste propio de su antigüedad y se aproxima al final de su vida útil. Se recomienda presupuestar su sustitución.
          - Se observan zonas de encharcamiento en la cubierta plana. Revisar pendientes y desagües.
      - code: gutters
        title: Canalones y bajantes
        materials: [PVC, Zinc, Cobre, Aluminio, Acero galvanizado, Canalón oculto]
        comments:
          - Canalones con acumulación de hojas y residuos. Se recomienda limpieza.
          - Bajante que vierte junto a la fachada. Se recomienda prolongarla para alejar el agua de la cimentación.
          - Se observan uniones con goteo o fugas en los canalones.
      - code: flashings
        title: Tapajuntas y remates
        materials: [Plomo, Zinc, Aluminio, Chapa galvanizada, Mortero, Tela asfáltica]
        comments:
          - Remates de mortero fisurados o desprendidos en el encuentro con paramentos verticales.
          - Tapajuntas mal sellados; riesgo de filtración. Se recomienda revisión y sellado.
      - code: chimneys
        title: Chimeneas (exterior)
        materials: [Ladrillo, Piedra, Metálica, Prefabricada de hormigón, Revestida con mortero]
        comments:
          - Se observan juntas deterioradas en la fábrica de la chimenea. Se recomienda rejuntado.
          - Falta sombrerete o protección contra la lluvia en la salida de humos.
      - code: skylights
        title: Claraboyas, lucernarios y penetraciones
        materials: [Claraboya fija, Ventana de tejado practicable, Lucernario de policarbonato, Ventilaciones, Antenas y soportes, Paneles solares]
        comments:
          - Sellado deteriorado alrededor de la claraboya. Se recomienda revisar y resellar.
          - Penetraciones de cubierta sin remate adecuado; posible punto de entrada de agua.

  - code: exterior
    title: Exterior
    description: Revestimiento y fachada, molduras y aleros, puertas, terrazas, escaleras, terreno, vegetación y accesos.
    items:
      - code: cladding
        title: Revestimiento y fachada
        materials: [Ladrillo cara vista, Revoco o mortero monocapa, Piedra, Aplacado cerámico, SATE (aislamiento exterior), Madera, Panel composite, Hormigón visto]
        comments:
          - Fisuras en el revestimiento de fachada. Se recomienda su seguimiento y, en su caso, evaluación por un técnico.
          - Desconchados y pérdida de pintura en fachada; mantenimiento recomendado.
          - Fisura escalonada en fábrica de ladrillo que puede indicar movimiento estructural. Se recomienda evaluación por especialista.
      - code: trim
        title: Molduras, aleros y cornisas
        materials: [Madera, Hormigón, Piedra, Metálicos, PVC]
        comments:
          - Madera de aleros con pudrición o pintura deteriorada. Se recomienda reparar y proteger.
          - Desprendimiento parcial de cornisa; riesgo de caída de fragmentos.
      - code: doors
        title: Puertas exteriores
        materials: [Madera, Metálica, Aluminio, PVC, Acristalada, Blindada o acorazada]
        comments:
          - La puerta roza o cierra con dificultad. Se recomienda ajuste.
          - Burletes deteriorados; entrada de aire y agua. Se recomienda sustituirlos.
      - code: decks
        title: Terrazas, balcones y porches
        materials: [Hormigón, Madera, Baldosa cerámica, Piedra, Estructura metálica]
        comments:
          - Óxido visible en armaduras del vuelo del balcón. Se recomienda evaluación por un técnico.
          - Pendiente insuficiente en la terraza; el agua se acumula junto al paramento.
      - code: stairs
        title: Escaleras y barandillas exteriores
        materials: [Hormigón, Piedra, Metálica, Madera, Barandilla de vidrio]
        comments:
          - Barandilla con altura insuficiente o huecos que permiten el paso de un niño. Riesgo para la seguridad.
          - Peldaños con altura irregular; riesgo de tropiezo.
      - code: grading
        title: Pendiente del terreno y drenaje
        materials: [Pendiente hacia fuera de la vivienda, Terreno plano, Pendiente hacia la vivienda, Drenaje perimetral, Arquetas y sumideros]
        comments:
          - El terreno tiene pendiente hacia la vivienda. Se recomienda corregirla para alejar el agua de la cimentación.
          - Arquetas o sumideros obstruidos; se recomienda limpieza.
      - code: vegetation
        title: Vegetación junto a la vivienda
        materials: [Árboles cerca de la fachada, Arbustos en contacto con la fachada, Trepadoras en fachada, Raíces próximas a la cimentación]
        comments:
          - Vegetación en contacto con la fachada. Se recomienda podar para mantener una separación mínima.
          - Árbol de gran porte próximo a la vivienda; vigilar raíces y ramas sobre la cubierta.
      - code: driveways
        title: Caminos y entrada de vehículos
        materials: [Hormigón, Asfalto, Adoquín, Grava, Baldosa]
        comments:
          - Pavimento con fisuras y desniveles; riesgo de tropiezo.

  - code: structure
    title: Sótano, cimentación, cámara sanitaria y estructura
    description: Cimentación, estructura de suelos, muros y techos, y signos de humedad o filtraciones.
    items:
      - code: foundation
        title: Cimentación
        materials: [Zapatas corridas, Zapatas aisladas, Losa de cimentación, Pilotes, Muros de hormigón, Muros de mampostería, No visible]
        comments:
          - Cimentación no visible por acabados; no se ha podido evaluar.
          - Fisuras en muros de cimentación. Se recomienda evaluación por un técnico especialista en estructuras.
      - code: basement
        title: Sótano o cámara sanitaria
        materials: [Sótano, Semisótano, Cámara sanitaria (forjado sanitario), Solera sobre el terreno]
        comments:
          - Cámara sanitaria sin ventilación suficiente; riesgo de condensaciones.
          - Acceso a la cámara sanitaria no disponible; no inspeccionada.
      - code: floors
        title: Estructura de suelos (forjados)
        materials: [Forjado de viguetas y bovedillas, Losa de hormigón, Vigas de madera, Vigas metálicas, Forjado reticular, No visible]
        comments:
          - Deformación apreciable del suelo. Se recomienda evaluación por especialista.
          - Vigas de madera con signos de ataque de xilófagos. Se recomienda tratamiento y evaluación.
      - code: walls
        title: Muros y estructura vertical
        materials: [Muros de carga de ladrillo, Pilares de hormigón, Pilares metálicos, Entramado de madera, Bloque de hormigón, Piedra]
        comments:
          - Sin signos visibles de lesiones estructurales en las zonas accesibles.
          - Fisura diagonal en muro de carga. Se recomienda evaluación por un técnico especialista en estructuras.
      - code: ceilings
        title: Estructura de techos y cubierta
        materials: [Cerchas de madera, Vigas de madera, Forjado de hormigón, Estructura metálica, No visible]
        comments:
          - Manchas de humedad en la estructura de cubierta, indicativas de filtraciones pasadas o activas.
      - code: moisture
        title: Humedad y filtraciones
        materials: [Sin signos visibles, Manchas de humedad, Eflorescencias, Condensación, Humedad por capilaridad, Filtración activa]
        comments:
          - Humedad por capilaridad en la parte baja de los muros. Se recomienda evaluación por especialista.
          - Lecturas de humedad elevadas en el punto indicado. Se recomienda localizar el origen.

  - code: heating
    title: Calefacción
    description: Tipo de sistema, combustible, ubicación, funcionamiento con los controles normales y evacuación de humos.
    items:
      - code: system
        title: Sistema de calefacción
        materials: [Caldera con radiadores, Suelo radiante, Bomba de calor aire-agua, Radiadores eléctricos, Acumuladores, Estufa, Calefacción central del edificio, Sin calefacción]
        comments:
          - El sistema funcionó con los controles normales en el momento de la inspección.
          - Se recomienda una revisión anual por un técnico autorizado.
      - code: fuel
        title: Combustible o energía
        materials: [Gas natural, Propano o butano, Gasóleo, Electricidad, Biomasa o pellets, Leña]
      - code: location
        title: Ubicación del equipo
        materials: [Cocina, Galería o lavadero, Sótano, Garaje, Exterior, Cuarto de calderas, Bajocubierta]
      - code: operation
        title: Funcionamiento con controles normales
        materials: [Funciona correctamente, Funcionamiento parcial, No responde, No probado]
        comments:
          - El equipo no respondió a los controles normales. Se recomienda revisión por un técnico autorizado.
          - Radiadores que no calientan de forma uniforme; posible aire en el circuito.
      - code: venting
        title: Evacuación de humos
        materials: [Chimenea, Salida coaxial a fachada, Conducto a cubierta, Sin salida de humos (eléctrico)]
        comments:
          - Salida de humos con separación insuficiente a ventanas. Riesgo para la seguridad; revisión por técnico autorizado.

  - code: cooling
    title: Refrigeración y climatización
    description: Tipo de equipo, antigüedad y funcionamiento.
    items:
      - code: system
        title: Equipo de climatización
        materials: [Split, Multisplit, Conductos, Bomba de calor aire-aire, Aerotermia, Equipo portátil, Sin climatización]
        comments:
          - Unidad exterior con suciedad en la batería; se recomienda limpieza y mantenimiento.
          - Desagüe de condensados que vierte sobre la fachada o la vía pública.
      - code: age
        title: Antigüedad del equipo
        materials: [Menos de 5 años, 5 a 10 años, 10 a 15 años, Más de 15 años, Desconocida]
        comments:
          - El equipo se aproxima al final de su vida útil estimada. Se recomienda presupuestar su sustitución.
      - code: operation
        title: Funcionamiento
        materials: [Enfría correctamente, Calienta correctamente, No responde, No probado por la temperatura exterior]
        comments:
          - No se ha probado en modo frío por la baja temperatura exterior.

  - code: plumbing
    title: Fontanería
    description: Llave de paso, tuberías de suministro y desagüe, calentador, aparatos sanitarios y bombas.
    items:
      - code: main_valve
        title: Llave de paso general
        materials: [Interior de la vivienda, Arqueta exterior, Junto al contador, No localizada]
        comments:
          - No se ha localizado la llave de paso general. Se recomienda identificarla y señalizarla.
      - code: supply
        title: Tuberías de suministro
        materials: [Cobre, Multicapa, PEX, PVC o CPVC, Acero galvanizado, Plomo, Polibutileno]
        comments:
          - Tuberías de plomo visibles. Se recomienda su sustitución.
          - Tuberías de acero galvanizado con corrosión; posible pérdida de caudal.
      - code: drains
        title: Distribución, desagües y ventilación
        materials: [PVC, Fundición, Fibrocemento, Polipropileno, Plomo]
        comments:
          - Desagüe lento en el aparato indicado. Se recomienda revisión.
          - Bajantes de fibrocemento; posible presencia de amianto. Consultar con profesional cualificado.
      - code: water_heater
        title: Calentador o termo (tipo, capacidad, año)
        materials: [Termo eléctrico, Calentador de gas, Caldera mixta, Bomba de calor para ACS, Solar térmica con acumulador]
        comments:
          - Falta válvula de seguridad o su desagüe no está conducido.
          - El equipo supera la vida útil habitual. Se recomienda presupuestar su sustitución.
      - code: fixtures
        title: Grifos e inodoros
        materials: [Grifería monomando, Grifería bimando, Grifería termostática, Inodoro con cisterna, Inodoro suspendido, Fluxor]
        comments:
          - Grifo con goteo. Se recomienda reparar.
          - Cisterna que no deja de cargar; consumo de agua innecesario.
      - code: sinks
        title: Lavabos, fregaderos, duchas y bañeras
        materials: [Lavabo, Fregadero, Plato de ducha, Bañera, Bidé]
        comments:
          - Sellado deteriorado en el encuentro de la bañera o ducha con el alicatado. Se recomienda resellar.
      - code: pumps
        title: Bombas de achique y grupos de presión
        materials: [Bomba de achique, Grupo de presión, Descalcificador, Ninguno]
        comments:
          - La bomba de achique no se ha podido probar.

  - code: electrical
    title: Electricidad
    description: Acometida, cuadro general, protecciones, cableado, enchufes y detectores.
    items:
      - code: service
        title: Acometida
        materials: [Aérea, Subterránea, Contador individual, Centralización de contadores]
      - code: panel
        title: Cuadro general (potencia y amperaje)
        materials: [IGA 25 A, IGA 32 A, IGA 40 A, IGA 63 A, Cuadro con carril DIN, Cuadro antiguo con fusibles]
        comments:
          - Cuadro sin tapa o con elementos en tensión accesibles. Riesgo para la seguridad.
          - Circuitos sin identificar en el cuadro. Se recomienda rotularlos.
      - code: protection
        title: Protecciones (diferenciales y magnetotérmicos)
        materials: [Diferencial 30 mA, Varios diferenciales, Magnetotérmicos por circuito, Protector contra sobretensiones, Fusibles]
        comments:
          - El diferencial no disparó al pulsar el botón de prueba. Riesgo para la seguridad; revisión por instalador autorizado.
          - No existe protección diferencial. Se recomienda su instalación por un instalador autorizado.
      - code: wiring
        title: Tipo de cableado
        materials: [Cobre bajo tubo, Aluminio, Cableado antiguo con aislamiento textil, Cableado superficial]
        comments:
          - Empalmes sin caja de registro. Se recomienda su corrección por un instalador autorizado.
      - code: outlets
        title: Enchufes con toma de tierra
        materials: [Con toma de tierra, Sin toma de tierra, Mixto, Enchufes protegidos en zonas húmedas]
        comments:
          - Enchufes sin toma de tierra en zonas húmedas. Riesgo para la seguridad.
          - Polaridad invertida en el enchufe indicado.
      - code: detectors
        title: Detectores de humo y CO
        materials: [Detector de humo, Detector de CO, Detector de gas, Ninguno]
        comments:
          - No se han observado detectores de humo. Se recomienda su instalación.
          - Se recomienda instalar un detector de monóxido de carbono cerca de los aparatos de combustión.

  - code: fireplaces
    title: Chimeneas y estufas
    description: Chimenea, conducto, tiro y cámara de combustión.
    items:
      - code: fireplace
        title: Hogar o chimenea
        materials: [Chimenea abierta, Insert o cassette, Estufa de leña, Estufa de pellets, Chimenea de gas]
        comments:
          - Se recomienda una inspección y limpieza del conducto por un deshollinador antes de su uso.
      - code: flue
        title: Conducto de humos
        materials: [Acero inoxidable, Obra de ladrillo, Cerámico, Doble pared aislado]
        comments:
          - Acumulación de hollín en el conducto. Se recomienda limpieza.
      - code: draft
        title: Tiro
        materials: [Correcto, Insuficiente, No probado]
      - code: firebox
        title: Cámara de combustión
        materials: [Ladrillo refractario, Fundición, Chapa de acero, Vermiculita]
        comments:
          - Ladrillos refractarios agrietados o desprendidos en la cámara de combustión.

  - code: attic
    title: Ático, aislamiento y ventilación
    description: Acceso, tipo y espesor del aislamiento, ventilación y extractores al exterior.
    items:
      - code: access
        title: Acceso
        materials: [Trampilla, Escalera escamoteable, Puerta, Sin acceso]
        comments:
          - Acceso al bajocubierta no disponible; no inspeccionado.
      - code: insulation
        title: Aislamiento (tipo y espesor)
        materials: [Lana mineral, Lana de roca, Poliestireno, Poliuretano proyectado, Celulosa, Sin aislamiento visible]
        comments:
          - Espesor de aislamiento insuficiente según los estándares actuales. Se recomienda mejorarlo.
          - Aislamiento desplazado o compactado en algunas zonas.
      - code: ventilation
        title: Ventilación del bajocubierta
        materials: [Rejillas en aleros, Ventilación en cumbrera, Aireadores en faldón, Sin ventilación]
        comments:
          - Ventilación insuficiente del bajocubierta; signos de condensación en la cara inferior del tablero.
      - code: exhaust
        title: Extractores (baño, cocina, secadora)
        materials: [Extractor de baño al exterior, Campana de cocina al exterior, Secadora con salida exterior, Extracción al bajocubierta, Ventilación natural]
        comments:
          - El extractor descarga en el bajocubierta en lugar de al exterior. Se recomienda conducirlo al exterior.

  - code: interior
    title: Interior, puertas y ventanas
    description: Paredes, techos, suelos, escaleras, puertas, ventanas, encimeras, armarios y electrodomésticos integrados.
    items:
      - code: walls
        title: Paredes
        materials: [Yeso, Placa de yeso laminado, Ladrillo enlucido, Papel pintado, Azulejo, Madera]
        comments:
          - Fisuras en paredes, en su mayoría estéticas. Se recomienda seguimiento.
          - Manchas de humedad en la pared indicada. Se recomienda localizar el origen.
      - code: ceilings
        title: Techos
        materials: [Yeso, Placa de yeso laminado, Escayola, Falso techo registrable, Madera]
        comments:
          - Mancha en el techo bajo el baño de la planta superior; posible fuga. Se recomienda investigar.
      - code: floors
        title: Suelos
        materials: [Cerámico, Parquet, Tarima, Laminado, Vinílico, Piedra o mármol, Moqueta, Hormigón pulido]
        comments:
          - Piezas sueltas o huecas en el pavimento.
          - Tarima con abombamiento por humedad.
      - code: stairs
        title: Escaleras y barandillas
        materials: [Madera, Hormigón, Metálica, Mármol, Barandilla de vidrio]
        comments:
          - Falta pasamanos en la escalera. Riesgo para la seguridad.
      - code: doors
        title: Puertas interiores
        materials: [Madera maciza, Madera chapada, Lacada, Correderas, Acristaladas]
        comments:
          - Puertas que rozan o no cierran correctamente. Se recomienda ajustar.
      - code: windows
        title: Ventanas
        materials: [Aluminio, Aluminio con rotura de puente térmico, PVC, Madera, Acero, Vidrio simple, Doble acristalamiento]
        comments:
          - Doble acristalamiento con condensación interior; cámara con el sellado roto.
          - Herrajes que no cierran correctamente. Se recomienda ajuste o sustitución.
      - code: countertops
        title: Encimeras y armarios (muestra representativa)
        materials: [Granito, Cuarzo o compacto, Laminado, Madera, Porcelánico, Acero inoxidable]
        comments:
          - Daños por humedad en el fondo del armario bajo fregadero.
      - code: appliances
        title: Electrodomésticos integrados
        materials: [Horno, Placa de inducción, Placa vitrocerámica, Placa de gas, Lavavajillas, Campana extractora, Microondas, Frigorífico integrado]
        comments:
          - Los electrodomésticos se probaron con un ciclo básico y funcionaron en el momento de la inspección.

  - code: garage
    title: Garaje
    description: Puerta y motor (con sensor de seguridad), pared de separación con la vivienda y suelo.
    optional: true
    items:
      - code: door
        title: Puerta y motor
        materials: [Basculante, Seccional, Enrollable, Batiente, Motorizada, Con sensor de seguridad (fotocélula), Manual]
        comments:
          - La puerta motorizada no invierte el movimiento al detectar un obstáculo. Riesgo para la seguridad.
      - code: firewall
        title: Pared de separación con la vivienda
        materials: [Fábrica de ladrillo, Bloque de hormigón, Placa de yeso resistente al fuego, Puerta cortafuegos, Puerta sin resistencia al fuego]
        comments:
          - La puerta de comunicación con la vivienda no es resistente al fuego ni de cierre automático.
      - code: floor
        title: Suelo
        materials: [Hormigón, Hormigón pulido, Baldosa, Resina epoxi]
        comments:
          - Fisuras de retracción en la solera, habituales y sin relevancia estructural aparente.
